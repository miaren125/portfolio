<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio | Mía René Valenzuela Yescas</title>
    <!-- Fuentes elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILOS (CSS) --- */
        :root {
            --sakura: #EC9C9D;
            --misty-rose: #FFDBDD;
            --aloewood: #7F5836;
            --dark-chocolate: #443025;
            --green-light: #E5E6B5;
            --green-mid: #CACD7D;
            --green-dark: #969752;
            
            /* Glassmorphism */
            --glass-bg: rgba(255, 255, 255, 0.3);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            color: var(--dark-chocolate);
            /* Fondo temporal degradado para que se vea el vidrio */
            background: linear-gradient(135deg, var(--misty-rose), var(--green-light), var(--sakura));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            background-attachment: fixed;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            color: var(--dark-chocolate);
            margin-top: 0;
        }

        /* Efecto Glass general */
        .glass-nav, .glass-card, .folder-card, .btn-glass, .glass-modal .modal-content, .glass-footer {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(68, 48, 37, 0.1);
            border-radius: 15px;
        }

        /* Navegación */
        .glass-nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            z-index: 1000;
            padding: 15px 20px;
        }

        .glass-nav ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;
        }

        .glass-nav a {
            text-decoration: none;
            color: var(--dark-chocolate);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .glass-nav a:hover { color: var(--sakura); }

        /* Secciones */
        .section-bg {
            min-height: 100vh;
            padding: 120px 20px 40px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .double-column {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .column {
            flex: 1;
            min-width: 300px;
        }

        .glass-card {
            padding: 30px;
            margin-bottom: 20px;
        }

        /*
